<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Manage Q&A</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: rgba(0, 0, 0, 0.8) !important;
            backdrop-filter: blur(10px);
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }
        .btn-custom {
            border-radius: 25px;
            padding: 10px 20px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(45deg, #007bff, #0056b3);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(45deg, #0056b3, #004085);
            transform: scale(1.05);
        }
        .btn-success {
            background: linear-gradient(45deg, #28a745, #1e7e34);
            border: none;
        }
        .btn-success:hover {
            background: linear-gradient(45deg, #1e7e34, #155724);
            transform: scale(1.05);
        }
        .btn-danger {
            background: linear-gradient(45deg, #dc3545, #bd2130);
            border: none;
        }
        .btn-danger:hover {
            background: linear-gradient(45deg, #bd2130, #a02622);
            transform: scale(1.05);
        }
        .btn-warning {
            background: linear-gradient(45deg, #ffc107, #e0a800);
            border: none;
            color: #000;
        }
        .btn-warning:hover {
            background: linear-gradient(45deg, #e0a800, #d39e00);
            transform: scale(1.05);
        }
        .form-control {
            border-radius: 10px;
            border: 2px solid #ddd;
            transition: border-color 0.3s ease;
        }
        .form-control:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }
        .modal-content {
            border-radius: 15px;
            border: none;
        }
        .search-container {
            position: sticky;
            top: 20px;
            z-index: 100;
        }
        .qa-card {
            margin-bottom: 20px;
        }
        .qa-question {
            font-weight: 600;
            color: #333;
        }
        .qa-answer {
            color: #666;
        }
        .stats-card {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-cogs"></i> Admin Panel</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/"><i class="fas fa-comments"></i> Back to Chat</a>
                <a class="nav-link" href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8">
                <div class="card mb-4">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="fas fa-plus-circle"></i> Add New Q&A</h5>
                    </div>
                    <div class="card-body">
                        <form id="add-qa-form">
                            <div class="mb-3">
                                <label for="question" class="form-label">Question</label>
                                <input type="text" class="form-control" id="question" name="question" required>
                            </div>
                            <div class="mb-3">
                                <label for="answer" class="form-label">Answer</label>
                                <textarea class="form-control" id="answer" name="answer" rows="3" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-success btn-custom">
                                <i class="fas fa-plus"></i> Add Q&A
                            </button>
                        </form>
                    </div>
                </div>

                <div class="search-container">
                    <div class="card mb-4">
                        <div class="card-body">
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-search"></i></span>
                                <input type="text" class="form-control" id="search-input" placeholder="Search Q&A...">
                            </div>
                        </div>
                    </div>
                </div>

                <div id="qa-list" class="row">
                    <!-- Q&A cards will be loaded here -->
                </div>
            </div>

            <div class="col-md-4">
                <div class="card stats-card mb-4">
                    <div class="card-body text-center">
                        <h3 id="qa-count">0</h3>
                        <p class="mb-0">Total Q&A Pairs</p>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h6 class="mb-0"><i class="fas fa-info-circle"></i> Quick Actions</h6>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-warning btn-custom w-100 mb-2" onclick="exportQA()">
                            <i class="fas fa-download"></i> Export Q&A
                        </button>
                        <button class="btn btn-secondary btn-custom w-100" onclick="location.reload()">
                            <i class="fas fa-sync"></i> Refresh
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-edit"></i> Edit Q&A</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="edit-qa-form">
                        <input type="hidden" id="edit-original-question" name="original_question">
                        <div class="mb-3">
                            <label for="edit-question" class="form-label">Question</label>
                            <input type="text" class="form-control" id="edit-question" name="new_question" required>
                        </div>
                        <div class="mb-3">
                            <label for="edit-answer" class="form-label">Answer</label>
                            <textarea class="form-control" id="edit-answer" name="new_answer" rows="3" required></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" form="edit-qa-form" class="btn btn-primary">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let qaData = {};

        function loadQA() {
            fetch('/get_qa')
                .then(res => res.json())
                .then(data => {
                    qaData = data;
                    displayQA(data);
                    document.getElementById('qa-count').textContent = Object.keys(data).length;
                })
                .catch(err => console.error('Error loading Q&A:', err));
        }

        function displayQA(data) {
            const qaList = document.getElementById('qa-list');
            qaList.innerHTML = '';

            Object.entries(data).forEach(([question, answer]) => {
                const col = document.createElement('div');
                col.className = 'col-12 qa-card fade-in';
                col.innerHTML = `
                    <div class="card h-100">
                        <div class="card-body">
                            <h6 class="card-title qa-question"><i class="fas fa-question-circle text-primary"></i> ${question}</h6>
                            <p class="card-text qa-answer">${answer}</p>
                        </div>
                        <div class="card-footer bg-transparent">
                            <button class="btn btn-sm btn-warning me-2" onclick="editQA('${question.replace(/'/g, "\\'")}')">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteQA('${question.replace(/'/g, "\\'")}')">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </div>
                    </div>
                `;
                qaList.appendChild(col);
            });
        }

        function editQA(question) {
            document.getElementById('edit-original-question').value = question;
            document.getElementById('edit-question').value = question;
            document.getElementById('edit-answer').value = qaData[question.toLowerCase()];
            new bootstrap.Modal(document.getElementById('editModal')).show();
        }

        function deleteQA(question) {
            if (confirm(`Are you sure you want to delete this Q&A?\n\nQuestion: ${question}`)) {
                fetch('/delete_qa', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `question=${encodeURIComponent(question)}`
                })
                .then(() => loadQA())
                .catch(err => console.error('Error deleting Q&A:', err));
            }
        }

        document.getElementById('add-qa-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            fetch('/add_qa', {
                method: 'POST',
                body: formData
            })
            .then(() => {
                this.reset();
                loadQA();
                alert('Q&A added successfully!');
            })
            .catch(err => console.error('Error adding Q&A:', err));
        });

        document.getElementById('edit-qa-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            fetch('/edit_qa', {
                method: 'POST',
                body: formData
            })
            .then(() => {
                bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
                loadQA();
                alert('Q&A updated successfully!');
            })
            .catch(err => console.error('Error updating Q&A:', err));
        });

        document.getElementById('search-input').addEventListener('input', function() {
            const searchTerm = this.value.toLowerCase();
            const filtered = Object.fromEntries(
                Object.entries(qaData).filter(([q, a]) =>
                    q.toLowerCase().includes(searchTerm) || a.toLowerCase().includes(searchTerm)
                )
            );
            displayQA(filtered);
        });

        function exportQA() {
            const dataStr = JSON.stringify(qaData, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const exportFileDefaultName = 'qa_export.json';
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
        }

        // Load Q&A on page load
        loadQA();
    </script>
</body>
</html>
